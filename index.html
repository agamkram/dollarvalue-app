<body>
  <div class="fit-stage" id="fit-stage">
  <div class="app" id="app">
    <header class="topbar" role="banner">
      <div class="topbar-title">
        <h1 class="brand-title">DollarValue</h1>
        <span class="ver" id="verBadge" title="Build">v19</span>
      </div>
      <nav class="topbar-nav" aria-label="Primary">
        <a class="nav-link" href="./about.html">About</a>
      </nav>
    </header>

    <section class="hero" id="hero" aria-live="polite">
      <div class="hero-pair" id="heroPair">
        <div class="hero-side">
          <p class="hero-amt" id="heroFrom"></p>
          <p class="hero-unit" id="heroFromUnit" hidden></p>
          <p class="hero-cap" id="heroFromCap"></p>
        </div>
        <div class="hero-side">
          <p class="hero-amt hero-amt-now" id="heroTo"></p>
          <p class="hero-unit" id="heroToUnit" hidden></p>
          <p class="hero-cap" id="heroBy"></p>
        </div>
        <div class="hero-side" id="heroActualSide" hidden>
          <p class="hero-amt" id="heroActual"></p>
          <p class="hero-unit" id="heroActualUnit" hidden></p>
          <p class="hero-cap" id="heroCheck"></p>
        </div>
      </div>
      <p class="hero-measure" id="heroMeasure" hidden></p>
    </section>

    <section class="scan" aria-label="Other items versus this measure">
      <p class="scan-cap" id="heatCap"></p>
      <div class="heat" id="heat"></div>
      <p class="work" id="work" hidden></p>
    </section>

    <section class="dials" aria-label="Wheels">
      <div class="dial-pair">
        <div class="dial">
          <div class="dial-label">Then</div>
          <div class="drums">
            <div class="drum-shell"><div class="drum" id="drumThenYear" data-wheel="thenYear"></div></div>
            <div class="drum-shell"><div class="drum drum-m" id="drumThenMonth" data-wheel="thenMonth"></div></div>
          </div>
        </div>
        <div class="dial">
          <div class="dial-label">Now</div>
          <div class="drums">
            <div class="drum-shell"><div class="drum" id="drumNowYear" data-wheel="nowYear"></div></div>
            <div class="drum-shell"><div class="drum drum-m" id="drumNowMonth" data-wheel="nowMonth"></div></div>
          </div>
        </div>
      </div>
      <div class="dial-row">
        <div class="dial dial-wide">
          <div class="dial-label">Item</div>
          <div class="drum-shell"><div class="drum drum-wide" id="drumItem" data-wheel="item"></div></div>
        </div>
        <div class="dial dial-wide">
          <div class="dial-label">In terms of</div>
          <div class="drum-shell"><div class="drum drum-wide" id="drumYard" data-wheel="yard"></div></div>
        </div>
      </div>
      <div class="amount" id="amountWrap" hidden>
        <label for="amount">Amount</label>
        <span class="amount-prefix">$</span>
        <input
          id="amount"
          type="text"
          inputmode="decimal"
          enterkeyhint="done"
          autocomplete="off"
          value="1"
        />
      </div>
    </section>
  </div>
